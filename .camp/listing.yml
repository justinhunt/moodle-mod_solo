name: Poodll Solo
summary: Automatically graded speaking (or writing) assignments, scored by speech recognition and AI.
description: |
  The teacher sets a speaking topic: a prompt, a target speaking time, a target word count and
  optional target keywords. The student responds by recording themselves speaking or, in writing
  mode, by typing.

  **Automatic grading:** word count, grammar accuracy, relevance to the topic and speaking clarity
  all feed into the grade, and the student gets grammar correction suggestions as feedback.
  Teachers can review and adjust each grade, and scores go to the Moodle gradebook.

  Used for oral exam preparation, speaking practice with automated feedback, low and medium stakes
  speaking assessments such as placement tests, and short essay writing with instant feedback.

  **Requires a Cloud Poodll account.** Recording, transcription and AI grading run through the Cloud
  Poodll service, so the plugin needs an API user and secret from https://poodll.com to function.
